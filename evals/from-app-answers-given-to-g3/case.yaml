schema_version: "1.1"
name: from-app-answers-given-to-g3
expected_outcome: |
  With every G0 answer given and G0 approved in advance, Claude reads the external prototype without running it, writes app-inventory.md, records G0 as approved in advance, and goes on to docs/planning/work-breakdown.yaml in the Agile process with only Epics and Features. Epics are capabilities, not screens. The needs follow the user's answers: real sign-in, a real deposit hold and release, a real owner email; Messages gets a Feature in a later release, not in the first. Nothing the user and the code don't say is planned as decided: what happens to the deposit of a damaged or lost tool, what messages do, an owner accept-or-decline step, a map of pick-up places. The rules the code and its tests state (14 days at most, not your own tool, no overlapping loans, only the owner marks returned) are in the plan. No language, framework, library or storage technology is named in the Epics, Features or their constraints. The quality needs (WCAG 2.1 AA, EU data, about 300 users, office-hours availability) are recorded once and referenced by ID. The inventory's Features column is filled. The validator reports no FAIL, the review view is generated, the independent reviewer runs, and Claude stops at G3 with status draft or in-review, listing the Mocked and Placeholder screens and what was decided for each. The .env key's value appears nowhere.
context:
  scaffold_script: place-files.sh
