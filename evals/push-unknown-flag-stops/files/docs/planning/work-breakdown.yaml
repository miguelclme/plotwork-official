      confidence: high
      open_questions: [AQ-1]        # handed to the architecture workflow; not blocking
      downstream_notes: []
      tags: []
      ado_id: null

    - draft_id: TSH-FT-002
      type: Feature
      title: Tool listings
      parent: TSH-EP-001
      description: Members list the tools they are willing to lend, and browse the tools on their street.
      scope:
        in:
          - listing a tool with a name, a description and an optional photo
          - browsing the street's tools
        out:
          - searching other streets (CAP-6, Later)
          - deposits for valuable tools (CAP-5, Later)
      acceptance_criteria:
        - A member can list a tool with a name, a description and an optional photo.
        - A member can see every tool listed on their street, and who owns it.
      constraints: []
      nature: user-facing
      priority: Must
      rank: 2
      milestone: MS-1
      depends_on: [TSH-FT-001]
      traces_to: [CAP-2, FR-3, FR-4]
      sources: ["SRC-2, answer 3"]
      size_hint: M
      readiness: ready
      confidence: high
      open_questions: []
      downstream_notes: []
      tags: []
      ado_id: null

    - draft_id: TSH-FT-003
      type: Feature
      title: Borrowing
      parent: TSH-EP-001
      description: Members ask to borrow a tool for chosen dates; the owner accepts or declines, and marks it returned.
      scope:
        in:
          - asking to borrow a tool for chosen dates
          - accepting or declining a request
          - marking a tool as returned
        out:
          - reviews after a loan (CAP-4, Later)
          - deposits and payments (CAP-5, Later)
      acceptance_criteria:
        - A member can ask to borrow a listed tool for chosen dates.
        - The owner can accept or decline the request, and the member sees the answer.
        - The owner can mark a borrowed tool as returned.
        - The number of completed loans on the street can be counted, so OBJ-1 can be measured.
      constraints: []
      nature: user-facing
      priority: Must
      rank: 3
      milestone: MS-1
