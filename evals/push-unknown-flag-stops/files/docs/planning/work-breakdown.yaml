    - draft_id: TSH-FT-001
      type: Feature
      title: Street membership
      parent: TSH-EP-001
      description: An organiser invites the neighbours on their street, who join from an invite link.
      scope:
        in:
          - inviting neighbours with a link
          - joining the street from the link
        out:
          - more than one street (CAP-6, Later)
          - checking that members really live on the street
      acceptance_criteria:
        - An organiser can share an invite link for the street.
        - A person with the link can join the street as a member.
        - A member's profile holds only a name and an email address.
      constraints: []
      nature: user-facing
      priority: Must
      rank: 1
      milestone: MS-1
      depends_on: []
      traces_to: [CAP-1, FR-1, FR-2, CON-1]
