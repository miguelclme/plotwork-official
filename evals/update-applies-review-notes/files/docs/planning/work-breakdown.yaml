      sources: ["SRC-1 Phase 1"]
      readiness: ready
      confidence: high
      ado_id: null

    - draft_id: BCH-FT-001
      type: Feature
      title: Club setup & membership
      parent: BCH-EP-001
      description: Organisers create a club and invite members, who join from an invite link.
      scope:
        in:
          - creating a club with a name and a description
          - sharing an invite link
          - joining a club from the link
        out:
          - public club discovery (not in SRC-1)
      acceptance_criteria:
        - An organiser can create a club with a name and a description.
        - An organiser can share an invite link for the club.
        - A person with the link can join the club as a member.
      constraints: []
      nature: user-facing
      priority: Must
      rank: 1
      milestone: MS-1
      depends_on: []
      traces_to: [OBJ-1, CAP-1, FR-1, FR-2]
      sources: ["SRC-1 Phase 1, items 1-2"]
      readiness: ready
      confidence: high
      open_questions: []
      ado_id: null

    - draft_id: BCH-FT-002
      type: Feature
      title: Meetings
      parent: BCH-EP-001
      description: Organisers schedule meetings, and members see what is coming up.
      scope:
        in:
          - scheduling a meeting with a date, a place or an online link, and a book
          - the list of upcoming meetings
        out:
          - video calls (out of scope in SRC-1)
      acceptance_criteria:
        - An organiser can schedule a meeting with a date, a place or an online link, and the book to discuss.
        - Members see the club's upcoming meetings.
      constraints: []
      nature: user-facing
      priority: Must
      rank: 2
      milestone: MS-1
      depends_on: [BCH-FT-001]
      traces_to: [OBJ-1, CAP-2, FR-3]
      sources: ["SRC-1 Phase 1, item 3"]
      readiness: ready
      confidence: high
      open_questions: []
      ado_id: null

    - draft_id: BCH-FT-003
      type: Feature
      title: Choosing the next book
      parent: BCH-EP-001
      description: Members propose candidate books and vote; the organiser closes the vote.
      scope:
        in:
          - proposing candidate books
          - one vote per member per round
          - closing the vote and setting the next book
        out:
          - buying or linking to book shops (out of scope in SRC-1)
      acceptance_criteria:
        - Members can propose candidate books for the next meeting.
        - Each member can vote once per round, and the organiser can close the round.
        - Closing a round sets the winning book for the next meeting, applying the tie rule from Q-1.
      constraints: []
      nature: user-facing
      priority: Must
      rank: 3
      milestone: MS-1
      depends_on: [BCH-FT-001]
      traces_to: [OBJ-1, CAP-3, FR-4]
      sources: ["SRC-1 Phase 1, item 4"]
      readiness: ready
      confidence: medium            # Q-1 is open but non-blocking
      open_questions: [Q-1]
      ado_id: null

    - draft_id: BCH-FT-006
      type: Feature
      title: Quality verification before public launch
      parent: BCH-EP-001
      description: Verify the accessibility and page speed of the core flows before the public launch.
      scope:
        in:
          - an accessibility audit of the core flows against WCAG 2.1 AA
          - page-speed measurement of the core flows on 4G
        out:
          - fixing issues found (handled in the Feature that owns the flow)
      acceptance_criteria:
        - An accessibility audit of the core flows finds no WCAG 2.1 AA failures.
        - Core pages load in under 2 seconds on a 4G connection.
      constraints: []
      nature: verification
      priority: Must
      rank: 1
      milestone: MS-3
      depends_on: [BCH-FT-001, BCH-FT-002, BCH-FT-003]
      traces_to: [OBJ-3, NFR-2, NFR-3]
      sources: ["SRC-1 Phase 3"]
      readiness: ready
      confidence: high
      open_questions: []
      ado_id: null

