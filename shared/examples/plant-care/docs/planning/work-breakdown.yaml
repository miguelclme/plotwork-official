work_breakdown:
  project: Plant Care Reminder
  key: PLT
  process: Basic
  version: "1.0"
  status: approved
  rigor: Light
  planning_sources:
    - docs/planning/project-plan.md@v2
  global_constraints: [NFR-1]

  items:
    - draft_id: PLT-EP-001
      type: Epic
      title: Plant catalogue
      parent: null
      outcome: The user has all their plants, and where they live, in one place.
      description: >
        Users add, edit, remove and browse their plants by location. Includes the foundation
        needed to use the app: a deployable web app with single-user sign-in.
      scope:
        in:
          - adding a plant with a name, a location and an optional photo
          - editing and removing plants
          - browsing plants by location
          - a deployable web app with single-user sign-in
        out:
          - identifying plants from photos
          - a plant shop
      acceptance_criteria:
        - A user can add a plant with a name and a location, and optionally a photo.
        - A user can edit and remove their plants.
        - A user can see their plants grouped by location.
        - Only the signed-in user can see their plants.
      constraints: []
      nature: user-facing
      priority: Must
      rank: 1
      milestone: MS-1
      depends_on: []
      traces_to: [OBJ-2, CAP-1, FR-1, FR-2, FR-3]
      sources: ["SRC-1", "project-plan.md §2"]
      readiness: ready
      confidence: high
      open_questions: []
      tags: []
      ado_id: null

    - draft_id: PLT-EP-002
      type: Epic
      title: Watering schedule and reminders
      parent: null
      outcome: The user never misses a watering.
      description: >
        Each plant has a watering interval. The user marks plants as watered and receives
        one daily email listing the plants that are due.
      scope:
        in:
          - a watering interval per plant
          - marking a plant as watered
          - a daily reminder email
        out:
          - push notifications (the native app is out of scope)
      acceptance_criteria:
        - Each plant can have its own watering interval.
        - Marking a plant as watered restarts its interval.
        - The user receives at most one email per day, listing every plant that is due or overdue.
      constraints: []
      nature: user-facing
      priority: Must
      rank: 2
      milestone: MS-1
      depends_on: [PLT-EP-001]
      traces_to: [OBJ-1, CAP-2, FR-4, FR-5, FR-6]
      sources: ["SRC-1", "project-plan.md §3"]
      readiness: ready
      confidence: medium            # rests on ASM-1 (one email a day is enough)
      open_questions: [AQ-1]        # handed to the architecture workflow; not blocking
      tags: []
      ado_id: null

    - draft_id: PLT-EP-003
      type: Epic
      title: Household sharing
      parent: null
      outcome: A household keeps one shared list of plants.
      description: >
        The user invites household members, who then see and update the same plants and
        watering status.
      scope:
        in:
          - inviting a household member
          - a shared plant list and watering status
        out:
          - sharing plants with people outside the household
      acceptance_criteria:
        - A user can invite a household member.
        - Invited members see the same plants and watering status.
        - When any member marks a plant as watered, every member sees it.
      constraints: []
      nature: user-facing
      priority: Should
      rank: 1
      milestone: MS-2
      depends_on: [PLT-EP-001, PLT-EP-002]
      traces_to: [OBJ-1, CAP-3, FR-7, FR-8]
      sources: ["SRC-1", "project-plan.md §3"]
      readiness: ready
      confidence: high
      open_questions: []
      tags: []
      ado_id: null
